      { id: 'kl', name: 'Nipah Satay - Kampung Baru KL', address: 'Jalan Raja Abdullah, Kampung Baru, 50300 Kuala Lumpur', phone: '+6012-34567890' }
    ];

    const TESTIMONIALS = [
      {
        name: 'Dato’ Seri Rizal Rahman',
        role: 'Pelanggan Katering Korporat (Petronas)',
        rating: 5,
        comment: 'Satay kambing dia paling mantap! Lembut, langsung tak hamis dan kuah kacang betul-betul pekat macam kenduri dulu-dulu. Tetamu VIP semua puji.',

      {

        role: 'Pengantin Majlis Sanding (Bangi Convention)',
        rating: 5,
        comment: 'Book pakej live grill 1,000 cucuk untuk majlis kahwin. Team Nipah Satay sangat on-time, kemas, dan asap arang wangi membangkitkan selera tetamu.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'
      },
      {
        name: 'Chef Ammar Zul',
        role: 'Food Reviewer & Influencer',
        rating: 5,
        comment: 'Perapan serai dan kunyit dia menyerap sampai ke dalam isi ayam & daging. Makan panas-panas dengan sambal kicap cili padi... padu gila!',
        avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80'

    function App() {
      // Order & Cart State
      const [orderMode, setOrderMode] = useState('delivery'); // 'delivery' | 'pickup' | 'event'
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutModalOpen, setIsCheckoutModalOpen] = useState(false);
      const [isReceiptModalOpen, setIsReceiptModalOpen] = useState(false);
      const [lastConfirmedOrder, setLastConfirmedOrder] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [promoCode, setPromoCode] = useState('');
      const [appliedDiscount, setAppliedDiscount] = useState(0);
      const [activeTab, setActiveTab] = useState('home'); // 'home' | 'menu' | 'catering' | 'about' | 'contact'

      // Customer form details
      const [customerDetails, setCustomerDetails] = useState({
        name: '',
        phone: '',
        email: '',
        address: '',
        deliveryDate: new Date().toISOString().split('T')[0],
        deliveryTime: '18:00',
        branch: 'bangi',
        pickupPlateNo: '',
        eventType: 'Kenduri Kahwin',
        guestPax: 100,
        liveGrillNeeded: true,
        specialNotes: '',
        saucePreference: 'Bungkus Asing (Separate Gravy)'
      });

      // Show toast helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Add item to cart
      const addToCart = (item, qtyToAdd = null) => {
        const qty = qtyToAdd || item.minOrder || 1;
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + qty } : i);
          } else {
            return [...prev, { ...item, qty }];
          }
        });
        showToast(`✅ Ditambah ke troli: +${qty} ${item.unit} ${item.name}`);
      };

      // Update item quantity
      const updateQty = (itemId, newQty) => {
        if (newQty <= 0) {
          setCart(prev => prev.filter(i => i.id !== itemId));
          showToast('🗑️ Item dikeluarkan dari troli');
        } else {
          setCart(prev => prev.map(i => i.id === itemId ? { ...i, qty: newQty } : i));
        }
      };

      // Clear Cart
      const clearCart = () => {
        setCart([]);
        setAppliedDiscount(0);
        setPromoCode('');
      };

      // Apply Promo Code
      const handleApplyPromo = () => {
        const code = promoCode.trim().toUpperCase();
        if (code === 'NIPAH10' || code === 'SATAYSEDAP') {
          setAppliedDiscount(0.10); // 10% discount
          showToast('🎉 Kod Promo NIPAH10 berjaya ditebus! Diskaun 10%');
        } else if (code === 'KENDURI50') {
          setAppliedDiscount(0.15); // 15% discount
          showToast('🎉 Kod KENDURI50 berjaya! Diskaun 15%');
        } else {
          showToast('⚠️ Kod promo tidak sah. Cuba "NIPAH10"');
        }
      };

      // Totals
      const totalSkewerCount = useMemo(() => {
        return cart.reduce((acc, item) => {
          if (item.category === 'ayam' || item.category === 'lembu' || item.category === 'kambing') {
            return acc + item.qty;
          }
          return acc;
        }, 0);
      }, [cart]);

      const subtotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
      }, [cart]);

      const discountAmount = useMemo(() => {
        return subtotal * appliedDiscount;
      }, [subtotal, appliedDiscount]);

      const deliveryFee = useMemo(() => {
        if (orderMode === 'delivery') {
          return subtotal > 100 ? 0 : 8.00; // Free delivery over RM100
        }
        if (orderMode === 'event') {
          return customerDetails.liveGrillNeeded ? 50.00 : 25.00; // Setup and transport fee
        }
        return 0; // Pickup is free
      }, [orderMode, subtotal, customerDetails.liveGrillNeeded]);

      const grandTotal = useMemo(() => {
        return Math.max(0, subtotal - discountAmount + deliveryFee);
      }, [subtotal, discountAmount, deliveryFee]);

      // Category filtered items
      const filteredMenu = useMemo(() => {
        if (selectedCategory === 'all') return INITIAL_MENU;
        return INITIAL_MENU.filter(item => item.category === selectedCategory);
      }, [selectedCategory]);

      // Generate WhatsApp Direct Order Message
      const generateWhatsAppMessage = () => {
        const orderId = 'NPS-' + Math.floor(100000 + Math.random() * 900000);
        let text = `🔥 *TEMPAHAN NIPAH SATAY™ (${orderId})* 🔥\n\n`;
        text += `📌 *Mod Pesanan:* ${orderMode.toUpperCase()}\n`;
        text += `👤 *Nama:* ${customerDetails.name || 'Pelanggan'}\n`;
        text += `📞 *No Telefon:* ${customerDetails.phone || '-'}\n`;
        
        if (orderMode === 'delivery') {
          text += `📍 *Alamat Penghantaran:* ${customerDetails.address || '-'}\n`;
          text += `📅 *Tarikh/Masa:* ${customerDetails.deliveryDate} @ ${customerDetails.deliveryTime}\n`;
        } else if (orderMode === 'pickup') {
          const br = BRANCHES.find(b => b.id === customerDetails.branch);
          text += `🏪 *Cawangan Pickup:* ${br ? br.name : 'HQ Bangi'}\n`;
          text += `🚗 *No Plat Kenderaan:* ${customerDetails.pickupPlateNo || '-'}\n`;
          text += `⏰ *Masa Pengambilan:* ${customerDetails.deliveryTime}\n`;
        } else if (orderMode === 'event') {
          text += `🎪 *Jenis Acara:* ${customerDetails.eventType}\n`;
          text += `👥 *Anggaran Tetamu:* ${customerDetails.guestPax} Pax\n`;
          text += `🔥 *Stesen Live Grill:* ${customerDetails.liveGrillNeeded ? 'YA (Termasuk Pitmaster)' : 'TIDAK (Chafing Dish Delivery)'}\n`;
          text += `📍 *Lokasi Acara:* ${customerDetails.address || '-'}\n`;
          text += `📅 *Tarikh Majlis:* ${customerDetails.deliveryDate} (${customerDetails.deliveryTime})\n`;
        }

        text += `\n🍢 *SENARAI PESANAN:*\n`;
        cart.forEach((item, idx) => {
          text += `${idx + 1}. ${item.name} (${item.qty} ${item.unit}) - RM ${(item.price * item.qty).toFixed(2)}\n`;
        });

        text += `\n🌶️ *Pilihan Kuah:* ${customerDetails.saucePreference}\n`;
        if (customerDetails.specialNotes) {
          text += `📝 *Nota Khas:* ${customerDetails.specialNotes}\n`;
        }

        text += `\n💰 *RINGKASAN PEMBAYARAN:*\n`;
        text += `Subtotal: RM ${subtotal.toFixed(2)}\n`;
        if (appliedDiscount > 0) {
          text += `Diskaun Promo: -RM ${discountAmount.toFixed(2)}\n`;
        }
        text += `Caj Penghantaran/Setup: RM ${deliveryFee.toFixed(2)}\n`;
        text += `*JUMLAH KESELURUHAN: RM ${grandTotal.toFixed(2)}*\n\n`;
        text += `Mohon pihak Nipah Satay sahkan pesanan dan sediakan slot. Terima kasih! 🙏`;

        return { orderId, text };
      };

      // Submit Order Handler
      const handleConfirmOrder = () => {
        if (!customerDetails.name || !customerDetails.phone) {
          alert('Sila lengkapkan Nama dan Nombor Telefon anda terlebih dahulu.');
          return;
        }
        if (orderMode === 'delivery' && !customerDetails.address) {
          alert('Sila masukkan alamat penghantaran anda.');
          return;
        }
        if (orderMode === 'event' && !customerDetails.address) {
          alert('Sila masukkan lokasi majlis/acara katering anda.');
          return;
        }
        if (cart.length === 0) {
          alert('Troli anda masih kosong. Sila pilih menu terlebih dahulu.');
          return;
        }

        const { orderId, text } = generateWhatsAppMessage();
        const orderData = {
          orderId,
          date: new Date().toLocaleString('ms-MY'),
          customerDetails: { ...customerDetails },
          orderMode,
          cart: [...cart],
          subtotal,
          discountAmount,
          deliveryFee,
          grandTotal,
          rawText: text
        };

        setLastConfirmedOrder(orderData);
        setIsCheckoutModalOpen(false);
        setIsCartOpen(false);
        setIsReceiptModalOpen(true);

        // Confetti celebration
        if (window.confetti) {
          window.confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      };

      const sendToWhatsApp = () => {
        if (!lastConfirmedOrder) return;
        const targetPhone = '601123456789'; // Business WhatsApp number
        const encoded = encodeURIComponent(lastConfirmedOrder.rawText);
        window.open(`https://wa.me/${targetPhone}?text=${encoded}`, '_blank');
      };

      // Quick Order presets
      const handleQuickAddCombo = (comboId) => {
        const item = INITIAL_MENU.find(i => i.id === comboId);
        if (item) {
          addToCart(item, 1);
          setIsCartOpen(true);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-brand-darker text-stone-100">
          
          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed top-20 right-5 z-50 bg-brand-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-orange-400 animate-bounce">
              <i data-lucide="sparkles" className="w-5 h-5"></i>
              <span className="font-semibold text-sm">{toastMessage}</span>
            </div>
          )}

          {/* TOP ANNOUNCEMENT BANNER */}
          <div className="bg-gradient-to-r from-amber-600 via-orange-600 to-red-700 text-white text-xs md:text-sm py-2 px-4 text-center font-medium flex items-center justify-center gap-3 shadow-inner">
            <span className="flex h-2 w-2 relative">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
              <span className="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
            </span>
            <span>🔥 <strong>DAPUR ARANG SEDANG MEMBARA!</strong> Penghantaran Pantas Sekitar Lembah Klang & Tempahan Katering Live Grill Kini Dibuka!</span>
            <span className="hidden md:inline bg-black/30 px-2 py-0.5 rounded text-xs">Kod: NIPAH10 (Diskaun 10%)</span>
          </div>

                        </div>

                        {/* Promo Code Input */}
                        <div className="pt-2">
                          <div className="flex gap-2">
                            <input 
                              type="text" 
                              placeholder="Kod Promo (cth: NIPAH10)"
                              value={promoCode}
                              onChange={(e) => setPromoCode(e.target.value)}
                              className="flex-1 bg-stone-900 border border-stone-800 rounded-xl px-3 py-2 text-xs text-white placeholder-stone-500 focus:outline-none focus:border-amber-500"
                            />
                            <button 
                              onClick={handleApplyPromo}
                              className="bg-stone-800 hover:bg-stone-700 text-amber-400 font-bold px-3 py-2 rounded-xl text-xs border border-stone-700"
                            >
                              Guna
                            </button>
                          </div>
                        </div>

                        {/* Sauces Preference */}
                        <div className="bg-stone-900/60 p-3 rounded-xl border border-stone-800 text-xs">
                          <label className="block text-stone-400 font-semibold mb-1">Pilihan Kuah & Sambal:</label>
                          <select 
                            value={customerDetails.saucePreference}
                            onChange={(e) => setCustomerDetails(prev => ({ ...prev, saucePreference: e.target.value }))}
                            className="w-full bg-stone-950 border border-stone-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-amber-500"
                          >
                            <option>Bungkus Asing (Kuah Kacang Standard)</option>
                            <option>Ekstra Pedas (+ Sambal Cili Padi)</option>
                            <option>Kurang Manis</option>
                            <option>Kuah Kacang Ekstra Pekat</option>
                          </select>
                        </div>
                      </>
                    )}

                  </div>

                  {/* Cart Footer / Checkout CTA */}
                  {cart.length > 0 && (
                    <div className="p-6 border-t border-stone-800 bg-stone-950 space-y-3">
                      
                      <div className="space-y-1.5 text-xs">
                        <div className="flex justify-between text-stone-400">
                          <span>Jumlah Cucuk Satay:</span>
                          <span className="font-semibold text-white">{totalSkewerCount} cucuk</span>
                        </div>
                        <div className="flex justify-between text-stone-400">
                          <span>Subtotal:</span>
                          <span className="font-semibold text-white">RM {subtotal.toFixed(2)}</span>
                        </div>
                        {appliedDiscount > 0 && (
                          <div className="flex justify-between text-emerald-400">
                            <span>Diskaun ({appliedDiscount * 100}%):</span>
                            <span>- RM {discountAmount.toFixed(2)}</span>
                          </div>
                        )}
                        <div className="flex justify-between text-stone-400">
                          <span>{orderMode === 'delivery' ? 'Caj Penghantaran:' : orderMode === 'event' ? 'Caj Setup Katering:' : 'Caj Pickup:'}</span>
                          <span className="font-semibold text-white">
                            {deliveryFee === 0 ? <span className="text-emerald-400">PERCUMA</span> : `RM ${deliveryFee.toFixed(2)}`}
                          </span>
                        </div>
                        <div className="pt-2 border-t border-stone-800 flex justify-between items-baseline">
                          <span className="font-bold text-sm text-white">Jumlah Bayaran:</span>
                          <span className="font-black text-xl gradient-text-gold">RM {grandTotal.toFixed(2)}</span>
                        </div>
                      </div>

                      <button 
                        onClick={() => {
                          setIsCartOpen(false);
                          setIsCheckoutModalOpen(true);
                        }}
                        className="w-full bg-gradient-to-r from-orange-600 via-amber-600 to-orange-600 hover:brightness-110 text-white font-extrabold py-3.5 rounded-xl text-sm shadow-xl shadow-orange-950/60 transition-all flex items-center justify-center gap-2"
                      >
                        <span>Teruskan Ke Tempahan ({orderMode.toUpperCase()})</span>
                        <span>→</span>
                      </button>

                      <button 
                        onClick={clearCart}
                        className="w-full text-center text-xs text-stone-500 hover:text-red-400 transition-colors"
                      >
                        Kosongkan Troli
                      </button>

                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

          {/* CHECKOUT & DETAILS MODAL */}
          {isCheckoutModalOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-stone-950 border border-orange-500/30 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
                
                <div className="flex items-center justify-between border-b border-stone-800 pb-4">
                  <div>
                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                      <span>🍢</span>
                      <span>Maklumat Pesanan & Pembayaran</span>
                    </h3>
                    <p className="text-xs text-stone-400">Mod Pesanan: <strong className="text-amber-400 uppercase">{orderMode}</strong></p>
                  </div>
                  <button 
                    onClick={() => setIsCheckoutModalOpen(false)}
                    className="w-8 h-8 rounded-full bg-stone-900 text-stone-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                {/* Form Fields */}
                <div className="space-y-4 text-xs sm:text-sm">
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-stone-300 font-semibold mb-1">Nama Penuh *</label>
                      <input 
                        type="text" 
                        required
                        placeholder="cth: Ahmad Zaki"
                        value={customerDetails.name}
                        onChange={(e) => setCustomerDetails(prev => ({ ...prev, name: e.target.value }))}
                        className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-stone-300 font-semibold mb-1">No Telefon (WhatsApp) *</label>
                      <input 
                        type="tel" 
                        required
                        placeholder="cth: 012-3456789"
                        value={customerDetails.phone}
                        onChange={(e) => setCustomerDetails(prev => ({ ...prev, phone: e.target.value }))}
                        className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                      />
                    </div>
                  </div>

                  {/* Mode Specific Fields */}
                  {orderMode === 'delivery' && (
                    <div className="space-y-4">
                      <div>
                        <label className="block text-stone-300 font-semibold mb-1">Alamat Penuh Penghantaran *</label>
                        <textarea 
                          rows="2"
                          placeholder="No rumah, jalan, taman, poskod, bandar..."
                          value={customerDetails.address}
                          onChange={(e) => setCustomerDetails(prev => ({ ...prev, address: e.target.value }))}
                          className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                        ></textarea>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-stone-300 font-semibold mb-1">Tarikh Penghantaran</label>
                          <input 
                            type="date"
                            value={customerDetails.deliveryDate}
                            onChange={(e) => setCustomerDetails(prev => ({ ...prev, deliveryDate: e.target.value }))}
                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                          />
                        </div>
                        <div>
                          <label className="block text-stone-300 font-semibold mb-1">Masa Diingini</label>
                          <input 
                            type="time"
                            value={customerDetails.deliveryTime}
                            onChange={(e) => setCustomerDetails(prev => ({ ...prev, deliveryTime: e.target.value }))}
                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {orderMode === 'pickup' && (
                    <div className="space-y-4">
                      <div>
                        <label className="block text-stone-300 font-semibold mb-1">Pilih Cawangan Pickup *</label>
                        <select 
                          value={customerDetails.branch}
                          onChange={(e) => setCustomerDetails(prev => ({ ...prev, branch: e.target.value }))}
                          className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                        >
                          {BRANCHES.map(b => (
                            <option key={b.id} value={b.id}>{b.name}</option>
                          ))}
                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-stone-300 font-semibold mb-1">No Plat Kenderaan (Pandu Lalu)</label>
                          <input 
                            type="text" 
                            placeholder="cth: VDF 8812"
                            value={customerDetails.pickupPlateNo}
                            onChange={(e) => setCustomerDetails(prev => ({ ...prev, pickupPlateNo: e.target.value }))}
                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                          />
                        </div>
                        <div>
                          <label className="block text-stone-300 font-semibold mb-1">Anggaran Masa Ambil</label>
                          <input 
                            type="time"
                            value={customerDetails.deliveryTime}
                            onChange={(e) => setCustomerDetails(prev => ({ ...prev, deliveryTime: e.target.value }))}
                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {orderMode === 'event' && (
                    <div className="space-y-4">
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-stone-300 font-semibold mb-1">Jenis Acara / Majlis</label>
                          <select 
                            value={customerDetails.eventType}
                            onChange={(e) => setCustomerDetails(prev => ({ ...prev, eventType: e.target.value }))}
                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                          >
                            <option>Kenduri Perkahwinan / Sanding</option>
                            <option>Majlis Aqiqah & Kesyukuran</option>
                            <option>Jamuan Hari Jadi / Reunion</option>
                            <option>Acara Korporat & Syarikat</option>
                            <option>Open House Hari Raya</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-stone-300 font-semibold mb-1">Anggaran Tetamu (Pax)</label>
                          <input 
                            type="number"
                            value={customerDetails.guestPax}
                            onChange={(e) => setCustomerDetails(prev => ({ ...prev, guestPax: parseInt(e.target.value) || 0 }))}
                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="block text-stone-300 font-semibold mb-1">Lokasi Majlis / Dewan / Rumah *</label>
                        <textarea 
                          rows="2"
                          placeholder="Alamat dewan atau lokasi majlis..."
                          value={customerDetails.address}
                          onChange={(e) => setCustomerDetails(prev => ({ ...prev, address: e.target.value }))}
                          className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                        ></textarea>
                      </div>
                      <div className="flex items-center gap-2 bg-stone-900 p-3 rounded-xl border border-stone-800">
                        <input 
                          type="checkbox"
                          id="liveGrillCheck"
                          checked={customerDetails.liveGrillNeeded}
                          onChange={(e) => setCustomerDetails(prev => ({ ...prev, liveGrillNeeded: e.target.checked }))}
                          className="w-4 h-4 text-orange-600 rounded bg-stone-950 border-stone-700"
                        />
                        <label htmlFor="liveGrillCheck" className="text-xs text-stone-300">
                          Sediakan <strong>Stesen Live Grilling</strong> bersama Tukang Bakar Nipah Satay di lokasi majlis
                        </label>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-stone-300 font-semibold mb-1">Nota Tambahan / Permintaan Khas</label>
                    <input 
                      type="text" 
                      placeholder="cth: Minta kuah kacang lebih pekat, cili potong asing..."
                      value={customerDetails.specialNotes}
                      onChange={(e) => setCustomerDetails(prev => ({ ...prev, specialNotes: e.target.value }))}
                      className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 text-xs"
                    />
                  </div>

                </div>

                {/* Order Summary in Modal */}
                <div className="bg-stone-900/80 p-4 rounded-2xl border border-stone-800 text-xs space-y-2">
                  <div className="font-bold text-white flex justify-between">
                    <span>Ringkasan ({cart.length} item):</span>
                    <span className="text-amber-400">Jumlah: RM {grandTotal.toFixed(2)}</span>
                  </div>
                  <div className="text-stone-400 text-[11px]">
                    {cart.map(i => `${i.name} (${i.qty} ${i.unit})`).join(' • ')}
                  </div>
                </div>

                {/* Confirm Buttons */}
                <div className="space-y-3 pt-2">
                  <button 
                    onClick={handleConfirmOrder}
                    className="w-full bg-gradient-to-r from-emerald-600 via-orange-600 to-amber-600 hover:brightness-110 text-white font-black py-4 rounded-2xl text-sm shadow-xl transition-all flex items-center justify-center gap-2"
                  >
                    <span>Sahkan Tempahan & Hantar WhatsApp</span>
                    <span>📱</span>
                  </button>
                  <p className="text-center text-[11px] text-stone-400">
                    Setelah disahkan, ringkasan tempahan rasmi akan dijana dan dibuka terus melalui WhatsApp Nipah Satay.
                  </p>
                </div>

              </div>
            </div>
          )}

          {/* ORDER CONFIRMATION / RECEIPT MODAL */}
          {isReceiptModalOpen && lastConfirmedOrder && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-stone-950 border border-amber-500/40 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-6 text-center">
                
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center text-3xl mx-auto">
                  ✓
                </div>

                <div>
                  <span className="text-xs font-bold text-amber-400 tracking-wider uppercase">Tempahan Berjaya Dijana</span>
                  <h3 className="text-2xl font-black text-white mt-1">Resit Tempahan Rasmi</h3>
                  <p className="text-xs text-stone-400 mt-1">No. Rujukan: <strong className="text-white font-mono">{lastConfirmedOrder.orderId}</strong></p>
                </div>

                {/* Digital Receipt Card */}
                <div className="bg-stone-900 border border-dashed border-stone-700 p-5 rounded-2xl text-left text-xs space-y-3 font-mono">
                  
                  <div className="flex justify-between border-b border-stone-800 pb-2">
                    <span className="text-stone-400">Tarikh:</span>
                    <span className="text-white">{lastConfirmedOrder.date}</span>
                  </div>

                  <div className="flex justify-between border-b border-stone-800 pb-2">
                    <span className="text-stone-400">Pelanggan:</span>
                    <span className="text-white">{lastConfirmedOrder.customerDetails.name} ({lastConfirmedOrder.customerDetails.phone})</span>
                  </div>

                  <div className="flex justify-between border-b border-stone-800 pb-2">
                    <span className="text-stone-400">Mod Pesanan:</span>
                    <span className="text-amber-400 font-bold uppercase">{lastConfirmedOrder.orderMode}</span>
                  </div>

                  {/* Items */}
                  <div className="py-2 space-y-1.5 border-b border-stone-800">
                    <div className="text-stone-400 font-bold">Item Pesanan:</div>
                    {lastConfirmedOrder.cart.map((item, idx) => (
                      <div key={idx} className="flex justify-between text-stone-200">
                        <span>{item.qty}x {item.name}</span>
                        <span>RM {(item.price * item.qty).toFixed(2)}</span>
                      </div>
                    ))}
                  </div>

                  {/* Pricing Breakdown */}
                  <div className="space-y-1 pt-1">
                    <div className="flex justify-between text-stone-400">
                      <span>Subtotal:</span>
                      <span>RM {lastConfirmedOrder.subtotal.toFixed(2)}</span>
                    </div>
                    {lastConfirmedOrder.discountAmount > 0 && (
                      <div className="flex justify-between text-emerald-400">
                        <span>Diskaun:</span>
                        <span>-RM {lastConfirmedOrder.discountAmount.toFixed(2)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-stone-400">
                      <span>Caj Penghantaran/Setup:</span>
                      <span>RM {lastConfirmedOrder.deliveryFee.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-base font-bold text-amber-400 pt-2 border-t border-stone-700">
                      <span>JUMLAH BESAR:</span>
                      <span>RM {lastConfirmedOrder.grandTotal.toFixed(2)}</span>
                    </div>
                  </div>

                </div>

                {/* Actions */}
                <div className="space-y-3">
                  <button 
                    onClick={sendToWhatsApp}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-4 rounded-2xl text-sm shadow-xl shadow-emerald-950/60 transition-all flex items-center justify-center gap-2"
                  >
                    <span>Hantar WhatsApp Ke Restoran Nipah Satay</span>
                    <span>💬</span>
                  </button>

                  <button 
                    onClick={() => {
                      navigator.clipboard.writeText(lastConfirmedOrder.rawText);
                      showToast('📋 Teks pesanan telah disalin ke papan keratan!');
                    }}
                    className="w-full bg-stone-800 hover:bg-stone-700 text-stone-300 font-semibold py-2.5 rounded-xl text-xs transition-colors"
                  >
                    Salin Ringkasan Pesanan (Copy Text)
                  </button>

                  <button 
                    onClick={() => setIsReceiptModalOpen(false)}
                    className="text-xs text-stone-400 hover:text-white"
                  >
                    Tutup Resit
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
